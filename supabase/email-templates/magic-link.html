<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entra a MiBatute</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;padding:28px 14px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:28px;overflow:hidden;border:1px solid #e5e7eb;">
            <tr>
              <td style="background:#2d5a27;padding:28px;text-align:center;">
                <img src="https://www.mibatute.com/logo.png" width="86" alt="MiBatute" style="display:block;margin:0 auto 14px;border:0;">
                <div style="font-size:25px;line-height:1.1;font-weight:900;color:#ffffff;">MiBatute</div>
                <div style="font-size:13px;line-height:1.4;font-weight:700;color:#ffb703;margin-top:6px;">Acceso seguro</div>
              </td>
            </tr>
            <tr>
              <td style="padding:34px 30px 12px;">
                <div style="display:inline-block;background:#ffb703;color:#111827;font-size:11px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;padding:8px 12px;border-radius:999px;">Tu enlace</div>
                <h1 style="margin:18px 0 12px;font-size:28px;line-height:1.15;color:#111827;font-weight:900;">Entra a MiBatute</h1>
                <p style="margin:0;color:#4b5563;font-size:16px;line-height:1.65;">Usa este enlace para iniciar sesión de forma segura. Si prefieres código, usa el número que aparece más abajo.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 30px 10px;text-align:center;">
                <a href="{{ .ConfirmationURL }}" style="display:block;background:#2d5a27;color:#ffffff;text-decoration:none;font-size:15px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;padding:17px 22px;border-radius:18px;">Entrar ahora</a>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 30px 26px;text-align:center;">
                <p style="margin:0 0 10px;color:#6b7280;font-size:13px;font-weight:700;">Código de acceso</p>
                <div style="display:inline-block;background:#f8f9fa;border:1px dashed #d1d5db;border-radius:18px;padding:14px 22px;color:#111827;font-size:28px;font-weight:900;letter-spacing:6px;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="background:#f8f9fa;padding:22px 30px;text-align:center;border-top:1px solid #eef0f2;">
                <p style="margin:0;color:#6b7280;font-size:12px;line-height:1.6;">Si no solicitaste este acceso, puedes ignorar este correo.</p>
                <p style="margin:8px 0 0;color:#9ca3af;font-size:11px;">© MiBatute</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
